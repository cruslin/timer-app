<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<meta name="theme-color" content="#0f1115">
<meta name="app-version" content="0">
<script>
/* Portable-file self-update: if a newer build was downloaded earlier (see update
   check at the bottom), run that copy instead of the one embedded in this file. */
(function(){
  if(location.protocol !== 'file:') return;
  try {
    var mine = +document.querySelector('meta[name="app-version"]').content;
    var saved = JSON.parse(localStorage.getItem('timer-app-update') || 'null');
    if(saved && saved.v > mine){
      // Halt parsing so nothing else in this copy runs, then swap in the newer
      // page. (document.write can't be used: it is ignored while parsing.)
      window.stop();
      setTimeout(function(){
        var next = new DOMParser().parseFromString(saved.html, 'text/html');
        var head = document.head;
        var body = document.body || document.documentElement.appendChild(document.createElement('body'));
        while(head.firstChild) head.removeChild(head.firstChild);
        while(body.firstChild) body.removeChild(body.firstChild);
        function adopt(from, to){
          Array.prototype.slice.call(from.childNodes).forEach(function(node){
            if(node.nodeName === 'SCRIPT'){           // re-create so it executes
              var sc = document.createElement('script');
              sc.textContent = node.textContent;
              to.appendChild(sc);
            } else {
              to.appendChild(document.importNode(node, true));
            }
          });
        }
        adopt(next.head, head);
        adopt(next.body, body);
      }, 0);
    }
  } catch(e){}
})();
</script>
<style>
  :root{
    --bg:#0c1016; --panel:#151b24; --panel-2:#1b2330; --accent:#78b7ff; --accent2:#ff766f;
    --text:#f3f6fb; --muted:#98a4b5; --line:#2b3747;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Control view ---------- */
  body.control{
    min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 50% 0%, rgba(120,183,255,.11), transparent 38%),
      linear-gradient(145deg,#0b0f15 0%,#101722 100%);
  }
  .card{
    background:rgba(21,27,36,.94); border:1px solid rgba(152,164,181,.14);
    border-radius:24px; padding:32px; width:100%; max-width:500px;
    box-shadow:0 24px 80px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.035);

  h1{font-size:11px; font-weight:700; margin:0 0 22px; color:var(--muted); letter-spacing:.18em; text-transform:uppercase;}
  .modes{display:flex; gap:8px; margin-bottom:24px;}
  .modes button{
    flex:1; padding:11px 8px; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,.025); color:var(--muted); cursor:pointer; font-size:13px; font-weight:600; transition:all .2s ease;
  }
  .modes button.active{background:var(--accent); border-color:var(--accent); color:#07111f; box-shadow:0 6px 20px rgba(120,183,255,.2);}
  .modes button:hover:not(.active){border-color:var(--accent); color:var(--text);}

  .display{
    font-size:clamp(48px,11vw,72px); font-variant-numeric:tabular-nums; text-align:center;
    font-weight:750; letter-spacing:.015em; margin:26px 0 22px;
    transition:color .2s;
  }
  .display.editable{cursor:pointer;}
  .display.editable:hover{color:var(--accent);}
  .display.finished{color:var(--accent2); animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.4;}}

  .edit-row{display:flex; gap:8px; justify-content:center; margin-bottom:20px; align-items:center;}
  .edit-row label{font-size:11px; color:var(--muted); text-align:center;}
  .edit-col{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .edit-row input{

    background:#10161f; border:1px solid var(--line); color:var(--text); border-radius:9px;
  }
  .edit-row input:focus{outline:3px solid rgba(120,183,255,.2); border-color:var(--accent);}
  #applyEdit{
    padding:0 16px; height:40px; border-radius:9px; border:none;
    background:var(--accent); color:#07111f; cursor:pointer; font-size:14px; font-weight:700;
  }

  .controls{display:flex; gap:10px; margin-bottom:16px;}
  .controls button{
    flex:1; padding:14px; border:none; border-radius:11px; font-size:15px;
    font-weight:700; cursor:pointer; color:#07111f; transition:transform .2s ease, filter .2s ease;
  }
  .controls button:hover{filter:brightness(1.08); transform:translateY(-1px);}
  button:active{transform:translateY(1px) scale(.985);}
  button:focus-visible{outline:3px solid rgba(120,183,255,.48); outline-offset:3px;}
  #startStop{background:var(--accent);}
  #startStop.running{background:var(--accent2); color:#210907;}
  #reset{background:#293545; color:var(--text);}

  #project{

    transition:all .2s ease; margin-top:10px;
  }
  #project:hover{background:var(--accent); color:#07111f;}
  #project2:hover{background:var(--accent); color:#07111f;}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin:12px 0 0; line-height:1.5;}
  .mode-hint{font-size:12px; color:var(--muted); text-align:center; margin:0 auto; max-width:42ch; min-height:16px; line-height:1.5;}

  /* ---------- Projector view ---------- */
  body.projector{
    background:#0a1a3e; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    height:100vh; overflow:hidden;
    box-shadow: inset 0 0 0 8px #c8a84b;
  }

  /* Logo header */
  #projectorHeader{
    display:flex; flex-direction:column; align-items:center;
    padding:1vh 4vw 0;
    width:100%;
  }
  #projectorLogo{
    height:16vh; width:auto; max-width:60vw;
    object-fit:contain;
    filter: drop-shadow(0 4px 24px rgba(200,168,75,0.45));

  .gold-rule{
    width:60%; height:1px; margin-top:1vh;
    background: linear-gradient(90deg, transparent, #c8a84b, #ffd700, #c8a84b, transparent);

  /* Timer centre */
  #projectorInner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;

  #bigDisplay{
    font-size:min(19vw, 48vh); font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:0.02em; color:#ffd700; transition:color .3s; line-height:1;

  #bigDisplay.stopped{
    color:#c8a84b;
    text-shadow: 0 0 20px rgba(200,168,75,0.15);
  }
  #bigDisplay.finished{
    color:#ffe566; animation:pulse 1s ease-in-out infinite;
    text-shadow: 0 0 120px rgba(255,215,0,0.9), 0 0 50px rgba(255,215,0,0.6);
  }
  #modeLabel{
    font-size:2vw; color:#c8a84b; letter-spacing:8px;
    text-transform:uppercase; margin-top:1vh; text-align:center;
  }

  /* Bottom footer */
  #projectorFooter{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; padding:0 2.5vw 1vh;
  }
  .corner-dot{
    width:0.8vw; height:0.8vw; border-radius:50%; background:#c8a84b;
    box-shadow:0 0 10px rgba(200,168,75,0.7);

    flex:1; height:1px; margin:0 1.5vw;
    background: linear-gradient(90deg, transparent, rgba(200,168,75,0.5), transparent);
  }
</style>

<script>
  /* var, not const: the portable file may replace the page via document.write, which keeps the old global scope */
  var params = new URLSearchParams(window.location.search);
  var view = params.get('view');
  var isProjector = view === 'projector' || view === 'projector2';
  document.body.className = isProjector ? 'projector' : 'control';

  if(isProjector){
    const LOGO_MAIN = 'logo.png?v=3';
    const LOGO_ECCLESIA = 'ecclesia-logo.png?v=1';
    const logoSrc = view === 'projector2' ? LOGO_ECCLESIA : LOGO_MAIN;
    const logoAlt = view === 'projector2' ? 'Ecclesia' : '24 Hours with the King';
    document.body.innerHTML = `
      <div id="projectorHeader">

        <div class="gold-rule"></div>
      </div>
      <div id="projectorInner">
        <div id="bigDisplay" role="timer" aria-live="off">00:00:00</div>
        <div id="modeLabel">--</div>
      </div>
      <div id="projectorFooter">
        <div class="corner-dot"></div>
        <div class="footer-rule"></div>
        <div class="corner-dot"></div>
      </div>
    `;
  } else {
    document.body.innerHTML = `
      <div class="card">
        <h1>TIMER</h1>
        <div class="modes">
          <button data-mode="countup" class="active">Count Up</button>
          <button data-mode="countdown">Countdown</button>
          <button data-mode="stopwatch">Stopwatch</button>
        </div>
        <p class="mode-hint" id="modeHint">Counts up from a set start time. Click the display to edit.</p>
        <div class="display editable" id="display" role="timer" aria-live="polite" title="Click to edit time">00:00:00</div>
        <div class="edit-row" id="editRow" style="display:none;">
          <div class="edit-col">
            <input type="number" id="h" min="0" max="23" value="0">
            <label>HH</label>
          </div>
          <div class="edit-col">
            <input type="number" id="m" min="0" max="59" value="0">
            <label>MM</label>
          </div>
          <div class="edit-col">
            <input type="number" id="s" min="0" max="59" value="0">
            <label>SS</label>
          </div>
          <button id="applyEdit">Set</button>
        </div>
        <div class="controls">
          <button id="startStop">Start</button>
          <button id="reset">Reset</button>
        </div>
        <button id="project">&#128250; Project to Second Screen (24hours)</button>
        <button id="project2">&#128250; Project to Second Screen (Ecclesia)</button>
        <p class="hint">Opens a fullscreen timer window &mdash; drag it to your projector/TV, then press F11.</p>
        <p class="hint">Keyboard: <strong>Space</strong> = Start/Stop &nbsp;|&nbsp; <strong>R</strong> = Reset</p>
      </div>
    `;
  }
</script>

<script>
(function(){
  const MAX_SECONDS = 24 * 3600;
  const channel = new BroadcastChannel('timer-sync');

  function fmt(secs){
    secs = Math.max(0, Math.min(secs, MAX_SECONDS));
    const h = String(Math.floor(secs / 3600)).padStart(2, '0');
    const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  /* ---- Audio beep using Web Audio API (no external files needed) ---- */
  function beep(frequency, duration, volume){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e){ /* audio not available */ }
  }

  /* ============================
     PROJECTOR VIEW
     ============================ */
  if(isProjector){
    const bigDisplay = document.getElementById('bigDisplay');
    const modeLabel  = document.getElementById('modeLabel');
    const modeNames  = { countup:'Count Up', countdown:'Countdown', stopwatch:'Stopwatch' };

    channel.onmessage = (e) => {
      if(!e.data || e.data.display === undefined) return;
      const { display, running, finished, mode } = e.data;
      bigDisplay.textContent = display;
      bigDisplay.classList.toggle('stopped', !running && !finished);
      bigDisplay.classList.toggle('finished', !!finished);
      modeLabel.textContent = modeNames[mode] || '';
    };

    document.body.addEventListener('click', () => {
      if(!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
    channel.postMessage({ hello: true });  // ask the control window for the current time
    return;
  }

  /* ============================
     CONTROL VIEW
     ============================ */
  const MODE_HINTS = {
    countup:   'Counts up from a set start time. Click the display to edit.',
    countdown: 'Counts down to zero. Click the display to set the duration.',
    stopwatch: 'Classic stopwatch. Always starts from zero.',
  };

  let mode          = 'countup';
  let totalSeconds  = 0;
  let targetSeconds = 0;   // for countdown reset
  let running       = false;
  let finished      = false;
  let animFrameId   = null;
  let bgTimerId     = null;  // background timer (always runs)
  let startTime     = 0;   // timestamp when timer started (actual time now)
  let startValue    = 0;   // display value when timer started
  let lastDisplayedSecs = -1;  // to avoid unnecessary renders

  const STORAGE_KEY = 'timerState';

  function saveState(){
    const state = {
      mode,
      totalSeconds,
      targetSeconds,
      startTime,
      startValue,
      running,
      finished
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadState(){
    const saved = localStorage.getItem(STORAGE_KEY);
    if(!saved) return false;

    try {
      const state = JSON.parse(saved);
      const timePassed = Math.floor((Date.now() - state.startTime) / 1000);

      // Restore state
      mode = state.mode;
      targetSeconds = state.targetSeconds;
      finished = state.finished;

      if(state.running){
        // Timer was running - calculate current time based on actual elapsed device time
        if(mode === 'countdown'){
          totalSeconds = Math.max(0, state.startValue - timePassed);
          if(totalSeconds === 0){
            finished = true;
            running = false;
            saveState();
          } else {
            running = true;
            startTime = state.startTime;
            startValue = state.startValue;
          }
        } else {
          // For countup and stopwatch: display = startValue + elapsed
          totalSeconds = Math.min(MAX_SECONDS, state.startValue + timePassed);
          if(totalSeconds >= MAX_SECONDS){
            totalSeconds = MAX_SECONDS;
            running = false;
          } else {
            running = true;
            startTime = state.startTime;
            startValue = state.startValue;
          }
        }
      } else {
        // Timer was paused
        totalSeconds = state.totalSeconds;
        running = false;
      }

      lastDisplayedSecs = Math.floor(totalSeconds);
      return true;
    } catch(e){
      localStorage.removeItem(STORAGE_KEY);
      return false;
    }
  }

  function clearState(){
    localStorage.removeItem(STORAGE_KEY);
  }

  const display     = document.getElementById('display');
  const startStopBtn = document.getElementById('startStop');
  const resetBtn    = document.getElementById('reset');
  const editRow     = document.getElementById('editRow');
  const projectBtn  = document.getElementById('project');
  const project2Btn = document.getElementById('project2');
  const modeHint    = document.getElementById('modeHint');

  function broadcast(){
    channel.postMessage({ display: fmt(totalSeconds), running, finished, mode });
  }
  channel.onmessage = (e) => { if(e.data && e.data.hello) broadcast(); };

  function render(){
    display.textContent = fmt(totalSeconds);
    display.classList.toggle('finished', finished);
    saveState();
    broadcast();
  }

  function applyMode(newMode){
    mode = newMode;
    finished = false;

    // Stopwatch: lock editing, always reset to 0
    if(mode === 'stopwatch'){
      display.classList.remove('editable');
      display.title = '';
    } else {
      display.classList.add('editable');
      display.title = 'Click to edit time';
    }

    modeHint.textContent = MODE_HINTS[mode];
    totalSeconds = (mode === 'countdown') ? targetSeconds : 0;
    editRow.style.display = 'none';
    saveState();
    render();
  }

  function updateTimer(){
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    let newTotal;

    if(mode === 'countdown'){
      newTotal = Math.max(0, startValue - elapsed);
      if(newTotal === 0 && !finished){
        finished = true;
        totalSeconds = 0;
        stop();
        beep(880, 0.8, 0.4);
        setTimeout(() => beep(880, 0.8, 0.4), 900);
        setTimeout(() => beep(1100, 1.2, 0.4), 1800);
        return;
      }
    } else {
      // For countup and stopwatch: display = startValue + elapsed
      newTotal = Math.min(MAX_SECONDS, startValue + elapsed);
      if(newTotal >= MAX_SECONDS){
        stop();
        return;
      }
    }

    // Only update if seconds changed
    if(Math.floor(newTotal) !== lastDisplayedSecs){
      totalSeconds = newTotal;
      lastDisplayedSecs = Math.floor(newTotal);
      render();
    }
  }

  function animationLoop(){
    if(running) updateTimer();
    animFrameId = requestAnimationFrame(animationLoop);
  }

  function backgroundTick(){
    // This runs even when tab is hidden/minimized
    if(running) updateTimer();
  }

  function start(){
    if(running) return;
    finished = false;
    running = true;
    startTime = Date.now();  // Actual time when timer started
    startValue = totalSeconds;  // Display value at start
    lastDisplayedSecs = Math.floor(totalSeconds);
    startStopBtn.textContent = 'Stop';
    startStopBtn.classList.add('running');
    
    // Start both RAF loop (smooth updates when visible) and background timer
    animFrameId = requestAnimationFrame(animationLoop);
    bgTimerId = setInterval(backgroundTick, 500);  // Check every 500ms even when hidden
    
    saveState();
    broadcast();
  }

  function stop(){
    running = false;
    startStopBtn.textContent = 'Start';
    startStopBtn.classList.remove('running');
    cancelAnimationFrame(animFrameId);
    clearInterval(bgTimerId);
    saveState();
    render();
  }

  function reset(){
    stop();
    finished = false;
    totalSeconds = (mode === 'countdown') ? targetSeconds : 0;
    clearState();
    render();
  }

  function openEditRow(){
    if(mode === 'stopwatch') return;
    const isOpen = editRow.style.display !== 'none';
    if(isOpen){ editRow.style.display = 'none'; return; }
    document.getElementById('h').value = Math.floor(totalSeconds / 3600);
    document.getElementById('m').value = Math.floor((totalSeconds % 3600) / 60);
    document.getElementById('s').value = totalSeconds % 60;
    editRow.style.display = 'flex';
    document.getElementById('h').focus();
  }

  /* ---- Event listeners ---- */
  startStopBtn.addEventListener('click', () => running ? stop() : start());
  resetBtn.addEventListener('click', reset);
  display.addEventListener('click', openEditRow);

  document.getElementById('applyEdit').addEventListener('click', () => {
    const h = Math.min(23, Math.max(0, parseInt(document.getElementById('h').value) || 0));
    const m = Math.min(59, Math.max(0, parseInt(document.getElementById('m').value) || 0));
    const s = Math.min(59, Math.max(0, parseInt(document.getElementById('s').value) || 0));
    const secs = Math.min(h * 3600 + m * 60 + s, MAX_SECONDS);
    totalSeconds = secs;
    if(mode === 'countdown') targetSeconds = secs;
    editRow.style.display = 'none';
    finished = false;
    render();
  });

  document.querySelectorAll('.modes button').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.dataset.mode === mode) return;
      document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      stop();
      applyMode(btn.dataset.mode);
    });
  });

  projectBtn.addEventListener('click', () => {
    window.open(window.location.pathname + '?view=projector', 'projector',
      'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
    broadcast();
  });

  project2Btn.addEventListener('click', () => {
    window.open(window.location.pathname + '?view=projector2', 'projector2',
      'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
    broadcast();
  });

  /* ---- Keyboard shortcuts ---- */
  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){
      e.preventDefault();
      running ? stop() : start();
    }
    if(e.key.toLowerCase() === 'r') reset();
    if(e.key === 'Escape') editRow.style.display = 'none';
  });

  /* ---- Initialize: Load saved state or start fresh ---- */
  if(loadState()){
    // Restored from storage
    document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
    modeHint.textContent = MODE_HINTS[mode];
    
    if(running){
      // Automatically resume the timer
      startStopBtn.textContent = 'Stop';
      startStopBtn.classList.add('running');
      animFrameId = requestAnimationFrame(animationLoop);
      bgTimerId = setInterval(backgroundTick, 500);
    }
  } else {
    // Fresh start
    applyMode('countup');
  }
  
  render();
})();
</script>

<script>
/* ---- Offline / auto-update ---------------------------------------------
   Hosted (http/https): installable PWA; the service worker caches the app and
   serves the cached copy when offline.
   Portable file (file://): the newest build is downloaded from the hosted site
   and used in place of the embedded one on reload.
   Both: while online, the control window checks for a new build every minute.
   When one is found, every window reloads itself. The timer state is stored
   with its start time, so a running timer carries on across the reload. */
(function(){
  const SITE = 'https://cruslin.github.io/timer-app/';
  const isFile = location.protocol === 'file:';
  const isHttp = location.protocol.startsWith('http');
  if(!isFile && !isHttp) return;

  if(isHttp){
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const updates = new BroadcastChannel('timer-update');

  if(isProjector){
    updates.onmessage = e => { if(e.data === 'reload') location.reload(); };
    return;
  }

  const mine = +document.querySelector('meta[name="app-version"]').content;
  if(!mine) return;  // unbuilt dev copy: never replace it
  const base = isFile ? SITE : '';
  const CHECK_MS = 60000;

  function toast(text){
    const bar = document.createElement('div');
    bar.textContent = text;
    bar.style.cssText = 'position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#171a21;color:#e9edf3;border:1px solid #4f9dff;border-radius:8px;padding:8px 14px;font:13px sans-serif;z-index:9';
    document.body.appendChild(bar);
  }

  async function check(){
    if(!navigator.onLine) return;
    // Don't yank the page away while someone is typing a time.
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
    try {
      const {v} = await (await fetch(base + 'version.json', {cache:'no-store', signal: AbortSignal.timeout(8000)})).json();
      if(!(v > mine)) return;
      // Once per version per window, so a stale CDN copy can't cause a reload loop.
      if(sessionStorage.getItem('timer-app-reload') == v) return;

      if(isFile){
        const saved = JSON.parse(localStorage.getItem('timer-app-update') || 'null');
        if(!saved || saved.v < v){
          const html = await (await fetch(base + 'index.html', {cache:'no-store', signal: AbortSignal.timeout(30000)})).text();
          localStorage.setItem('timer-app-update', JSON.stringify({v, html}));
        }
      }
      sessionStorage.setItem('timer-app-reload', v);
      toast('Updating to the latest version…');
      updates.postMessage('reload');
      setTimeout(() => location.reload(), 600);
    } catch(e){ console.warn('update check failed:', e); }  // offline or unreachable: try again next time
  }

  check();
  setInterval(check, CHECK_MS);
  addEventListener('online', check);
})();
</script>
</body>
</html>
